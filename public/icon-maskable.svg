<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="m-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="m-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="m-ring-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Full bleed background for maskable safe-zone -->
  <rect width="512" height="512" fill="url(#m-bg-grad)" />

  <!-- Safe zone scaled to center (80% box = radius 204 inside 256) -->
  <g transform="translate(256, 256) scale(0.78) translate(-256, -256)">
    <!-- Outer orbital ring -->
    <circle cx="256" cy="256" r="170" fill="none" stroke="url(#m-ring-grad)" stroke-width="6" stroke-dasharray="16 12" />

    <!-- Inner circle shield -->
    <circle cx="256" cy="256" r="130" fill="url(#m-accent-grad)" opacity="0.15" />
    <circle cx="256" cy="256" r="115" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.4" />

    <!-- Stylized Compass / Globe Latitude & Longitude lines -->
    <ellipse cx="256" cy="256" rx="90" ry="40" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.3" />
    <ellipse cx="256" cy="256" rx="40" ry="90" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.3" />

    <!-- Stylized Supersonic Jet Icon in center -->
    <g transform="translate(256,256) scale(2.2) translate(-24,-24)">
      <path d="M22 2L26 2L28 16L42 24L42 28L28 24L27 38L32 42L32 46L24 44L16 46L16 42L21 38L20 24L6 28L6 24L20 16Z" 
            fill="url(#m-accent-grad)" 
            stroke="#ffffff" 
            stroke-width="1.5" 
            stroke-linejoin="round" />
    </g>

    <!-- Brand Typography -->
    <text x="256" y="445" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="5" 
          fill="#f8fafc">SOFIA TRAVEL</text>
    <text x="256" y="475" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="14" 
          font-weight="700" 
          letter-spacing="3" 
          fill="#38bdf8">MANAGEMENT SYSTEM</text>
  </g>
</svg>
